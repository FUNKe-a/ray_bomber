syntax = "proto3";

package player;

option go_package = "github.com/FUNKe-a/ray_bomber/server/internal/gen/protocol;protocol";

// server messages
message Greeting {
  uint32 id = 1;
}

message PlayerEvent {
  uint32 id = 1;

  enum State {
    UNKNOWN = 0;
    JOINED = 1;
    LEFT = 2;
  }

  State state = 2;
}

message PlayerMovement {
  uint32 id = 1;
  int32 x = 2;
  int32 y = 3;
}

// player messages
message MoveRequest {
  enum Direction {
    UNKNOWN = 0;
    UP = 1;
    RIGHT = 2;
    DOWN = 3;
    LEFT = 4;
  }

  Direction direction = 1;
}
