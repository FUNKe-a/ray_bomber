syntax = "proto3";

package match;

option go_package =
  "github.com/FUNKe-a/ray_bomber/server/internal/gen/protocol;protocol";

// Shared data

message Cell {
  int32 x = 1;
  int32 y = 2;
}

enum Terrain {
  TERRAIN_UNSPECIFIED = 0;
  TERRAIN_FLOOR = 1;
  TERRAIN_WALL = 2;
  TERRAIN_CRATE = 3;
}

message Board {
  uint32 width = 1;
  uint32 height = 2;

  // Row-major: index = y * width + x.
  // Must contain exactly width * height entries.
  repeated Terrain cells = 3;
}

message RoundRules {
  uint32 bomb_capacity = 1;
  uint32 blast_range = 2;
  uint32 bomb_fuse_ms = 3;
  uint32 blast_duration_ms = 4;
  uint32 movement_interval_ms = 5;
}

message PlayerSpawnInfo {
  uint32 player_id = 1;
  int32 x = 2;
  int32 y = 3;
}

// Preparation

message MatchSetup {
  repeated PlayerSpawnInfo spawns = 1;

  uint64 round_id = 2;
  Board board = 3;
  RoundRules rules = 4;
}

message ClientMatchReady {
  uint64 round_id = 1;
}

message StartMatch {
  uint64 round_id = 1;
}

// Movement

message MoveRequest {
  enum Direction {
    UNKNOWN = 0;
    UP = 1;
    RIGHT = 2;
    DOWN = 3;
    LEFT = 4;
  }

  Direction direction = 1;
  uint64 round_id = 2;
}

message PlayerMovement {
  uint32 id = 1;
  int32 x = 2;
  int32 y = 3;
  uint64 round_id = 4;
}

// Bomb placement

message PlaceBombRequest {
  uint64 round_id = 1;
}

message BombPlaced {
  uint64 round_id = 1;
  uint64 bomb_id = 2;
  uint32 owner_id = 3;
  Cell position = 4;
  uint32 blast_range = 5;

  // Presentation only; the server controls detonation.
  uint32 fuse_ms = 6;
}

// Rejected client actions

enum ActionType {
  ACTION_UNSPECIFIED = 0;
  ACTION_MOVE = 1;
  ACTION_PLACE_BOMB = 2;
  ACTION_START_GAME = 3;
  ACTION_RETURN_TO_LOBBY = 4;
}

enum RejectionReason {
  REJECTION_UNSPECIFIED = 0;
  REJECTION_WRONG_PHASE = 1;
  REJECTION_STALE_ROUND = 2;
  REJECTION_PLAYER_ELIMINATED = 3;
  REJECTION_BOMB_CAPACITY_REACHED = 4;
  REJECTION_TILE_BLOCKED = 5;
  REJECTION_MOVE_COOLDOWN = 6;
  REJECTION_NOT_LEADER = 7;
  REJECTION_INVALID_REQUEST = 8;
  REJECTION_NOT_ALL_READY = 9;
  REJECTION_NOT_ENOUGH_PLAYERS = 10;
}

message ActionRejected {
  // Zero for lobby actions without a round ID.
  uint64 round_id = 1;
  ActionType action = 2;
  RejectionReason reason = 3;
}

// Explosion and elimination updates

message Explosion {
  uint64 bomb_id = 1;
  repeated Cell cells = 2;

  // Presentation only; the server controls blast damage.
  uint32 duration_ms = 3;
}

enum EliminationReason {
  ELIMINATION_UNSPECIFIED = 0;
  ELIMINATION_BLAST = 1;
  ELIMINATION_DISCONNECTED = 2;
}

message PlayerEliminated {
  uint32 player_id = 1;
  EliminationReason reason = 2;
}

message WorldDelta {
  uint64 round_id = 1;
  repeated Explosion explosions = 2;
  repeated PlayerEliminated eliminations = 3;
  Board board = 4;
}

// Round results

enum RoundOutcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_WINNER = 1;
  OUTCOME_DRAW = 2;
}

message MatchEnded {
  uint64 round_id = 1;
  RoundOutcome outcome = 2;

  // Present only for OUTCOME_WINNER.
  optional uint32 winner_id = 3;
}

// Returning to the lobby

message ReturnToLobbyRequest {
  uint64 round_id = 1;
}

enum LobbyResetReason {
  RESET_UNSPECIFIED = 0;
  RESET_ROUND_FINISHED = 1;
  RESET_PREPARATION_DISCONNECT = 2;
  RESET_PREPARATION_TIMEOUT = 3;
}

message LobbyReset {
  // Identifies the round being discarded.
  uint64 round_id = 1;
  LobbyResetReason reason = 2;
}